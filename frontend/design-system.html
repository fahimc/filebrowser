<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Drive · Design system</title>
  <link rel="stylesheet" href="src/css/fonts.css">
  <link rel="stylesheet" href="src/css/drive-tokens.css">
  <link rel="stylesheet" href="src/css/drive-controls.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--drive-canvas); color: var(--drive-ink); font-family: Roboto, Arial, sans-serif; }
    .reference { max-width: 1120px; margin: auto; padding: 40px 24px; }
    .masthead, .examples { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .masthead { justify-content: space-between; margin-bottom: 32px; }
    .identity { display: flex; align-items: center; gap: 16px; }
    .identity img { width: 48px; height: 48px; }
    h1 { font-size: 28px; font-weight: 400; margin: 0 0 4px; }
    h2 { font-size: 20px; font-weight: 500; margin: 0 0 20px; }
    p { margin: 0; color: var(--drive-muted); line-height: 1.6; }
    section { padding: 28px; margin-bottom: 20px; border-radius: var(--drive-radius-xl); background: var(--drive-surface); }
    .swatches { display: grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap: 12px; }
    .swatch { padding: 20px 12px; border-radius: var(--drive-radius-md); border: 1px solid var(--drive-divider); }
    .surface { background: var(--drive-surface-low); }
    .selected { background: var(--drive-selected); color: var(--drive-on-selected); }
    .primary { background: var(--drive-primary); color: var(--drive-on-primary); }
    .danger { background: var(--drive-danger-container); color: var(--drive-danger); }
    .fields { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 20px; }
    label { display: grid; gap: 8px; }
    .drive-input { width: 100%; }
    .hint { font-size: 12px; color: var(--drive-muted); }
    .error { color: var(--drive-danger); }
    .new { min-height: 56px; border-radius: 16px; background: var(--drive-surface); color: var(--drive-ink); box-shadow: var(--drive-shadow-1); }
    .new span { font-size: 28px; font-weight: 400; }
    .split { display: grid; grid-template-columns: 240px minmax(0,1fr); gap: 32px; }
    .nav { display: grid; gap: 4px; }
    .nav button { justify-content: flex-start; color: var(--drive-ink); }
    .nav button { border-radius: var(--drive-radius-sm); }
    .nav [aria-current] { background: var(--drive-nav-selected); color: var(--drive-ink); }
    .file { display: flex; align-items: center; gap: 16px; padding: 16px; border: 0; border-radius: 12px; background: var(--drive-surface-low); color: var(--drive-ink); font: inherit; width: 100%; margin-bottom: 8px; text-align: left; cursor: pointer; }
    .file:hover { background: var(--drive-surface-high); }
    .file[aria-pressed="true"] { background: var(--drive-selected); color: var(--drive-on-selected); }
    .file svg { flex: 0 0 24px; fill: currentColor; }
    .file span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file small { color: var(--drive-muted); }
    .dialog { max-width: 440px; padding: 24px; border: 1px solid var(--drive-divider); border-radius: 24px; background: var(--drive-surface); box-shadow: var(--drive-shadow-2); }
    .dialog .examples { margin-top: 24px; justify-content: flex-end; }
    @media (max-width: 600px) { .reference { padding: 24px 16px; } section { padding: 20px; } .split { grid-template-columns: 1fr; gap: 24px; } h1 { font-size: 23px; } }
  </style>
</head>
<body>
  <main class="reference">
    <div class="masthead">
      <div class="identity"><img src="src/assets/branding/my_drive.svg" alt=""><div><h1>My Drive design system</h1><p>One set of controls. Every FileBrowser screen.</p></div></div>
      <button id="theme" class="drive-button drive-button--outlined" aria-pressed="false">Dark theme</button>
    </div>
    <section><h2>Surfaces & colour</h2><div class="swatches"><div class="swatch">Content</div><div class="swatch surface">Container</div><div class="swatch selected">Selected</div><div class="swatch primary">Primary</div><div class="swatch danger">Destructive</div></div></section>
    <section><h2>Actions</h2><div class="examples">
      <button class="drive-button new"><span aria-hidden="true">+</span>New</button>
      <button class="drive-button">Save changes</button>
      <button class="drive-button drive-button--tonal">Share</button>
      <button class="drive-button drive-button--outlined">Download</button>
      <button class="drive-button drive-button--text">Cancel</button>
      <button class="drive-button drive-button--danger">Delete</button>
      <button class="drive-button" disabled>Disabled</button>
      <button class="drive-icon-button" aria-label="Close">✕</button>
    </div></section>
    <section><h2>Form controls</h2><div class="fields">
      <label>Folder name<input class="drive-input" value="Project files"><span class="hint">Use a clear name for your folder.</span></label>
      <label>Visibility<select class="drive-input"><option>Only people with access</option><option>Anyone with the link</option></select></label>
      <label>Invalid name<input class="drive-input" aria-invalid="true" aria-describedby="name-error" value="/"><span id="name-error" class="hint error">Choose a name without a slash.</span></label>
    </div></section>
    <section><h2>Navigation & file selection</h2><div class="split"><nav class="nav" aria-label="Sample navigation"><button class="drive-button drive-button--text">Home</button><button class="drive-button" aria-current="page">My Drive</button><button class="drive-button drive-button--text">Photos</button><button class="drive-button drive-button--text">Image Studio</button></nav><div>
      <button class="file" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H2v16h20V6H12z"/></svg><span>Project documents</span><small>Folder</small></button>
      <button class="file" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H2v16h20V6H12z"/></svg><span>Selected folder</span><small>Folder</small></button>
      <p class="hint">Click a folder to toggle selection. Tab through controls to inspect focus.</p>
    </div></div></section>
    <section><h2>Dialog surface</h2><div class="dialog"><h2>New folder</h2><label>Folder name<input class="drive-input" placeholder="Untitled folder"></label><div class="examples"><button class="drive-button drive-button--text">Cancel</button><button class="drive-button">Create</button></div></div></section>
  </main>
  <script>
    const theme = document.getElementById('theme');
    theme.addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark-mode');
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      theme.setAttribute('aria-pressed', String(dark));
      theme.textContent = dark ? 'Light theme' : 'Dark theme';
    });
    document.querySelectorAll('.file').forEach(button => button.addEventListener('click', () => {
      button.setAttribute('aria-pressed', String(button.getAttribute('aria-pressed') !== 'true'));
    }));
  </script>
</body>
</html>
